services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carpet
      POSTGRES_USER: carpet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpet -d carpet"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://carpet:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/carpet
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes: {postgres_data: {}}
